<!DOCTYPE html>
<html>

<head>
    <meta charSet="UTF-8">
</head>

<script src="/test/script/common.js"></script>
<script>

    window.onload = (event) => {
        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString)
        const hospital = urlParams.get('hospital').trim();
        const msw_id = urlParams.get('msw_id').trim();  
        document.getElementById("test_label").innerText = "EWS Demo Logon [Login : " + hospital + "MSW" + msw_id + "]";
    };
    
    function onClick() {
        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString)
        const hospital = urlParams.get('hospital').trim();
        const msw_id = urlParams.get('msw_id').trim();
        const mssu = urlParams.get('mssu').trim();  

        if (checkAllowHospital(hospital)) {
            document.getElementById("inst_code").value = hospital;
            document.getElementById("user_id").value = hospital + "MSW" + msw_id;
            document.getElementById("user_name").value = "MSW User " + msw_id;
            document.getElementById("unit_code").value = mssu;

            submit("ews");
        } else {
            alert("This hospital is not available for testing");
        }
    }

</script>

<body>

    <div id="test_label"></div>
    <img src="/test/images/ewslogon.png" alt="cms logon demo" onclick="onClick()" />

    <div style="display: none">

        <form id="frmToDASS" method="post"
            action="https://has-dass-api-has-corp-dass-dev.tstcld61.server.ha.org.hk/has-dass-api/auth/ews">

            <input type="submit" value="Login"> <br /><br />

            inst_code : <input type="text" runat="server" name="inst_code" id="inst_code" value="VH" /><br />
            user_id : <input type="text" runat="server" name="user_id" id="user_id" value="VHMSW01" /><br />
            random_id : <input type="text" size="80" runat="server" name="random_id" id="random_id"
                value="SEEtREFTUy1FV1MtVEVTVC1UT0tFTg==" /> <br />
            user_name : <input type="text" runat="server" name="user_name" id="user_name"
                value="VH MSW User 01" /><br />
            unit_code : <input type="text" runat="server" name="unit_code" id="unit_code" value="VH (HA)" /><br />
            tel_no : <input type="text" runat="server" name="tel_no" id="tel_no" value="23008190" /><br />
            email : <input type="text" runat="server" name="email" id="email" value="" /><br />
            rank : <input type="text" runat="server" name="rank" id="rank" value="SWO" /><br />

        </form>
    </div>

    <body>

</html>
